services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    # O Caddy só precisa abrir as portas 80 e 443; as demais capacidades de root são retiradas.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - export:/srv/data:ro   # o site só lê os arquivos exportados pela coleta
      - caddy_data:/data      # certificados HTTPS
      - caddy_config:/config

  # Não fica rodando: é disparado pelo agendador do servidor com
  #   docker compose run --rm collector
  collector:
    build:
      context: .
      target: collector
    profiles: ["collect"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true         # a coleta só grava nos dois volumes abaixo
    volumes:
      - db:/data              # banco SQLite; nunca é servido ao público
      - export:/export

volumes:
  db:
  export:
  caddy_data:
  caddy_config:
