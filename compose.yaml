services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - export:/srv/data:ro   # o site só lê os arquivos exportados pela coleta
      - caddy_data:/data      # certificados HTTPS
      - caddy_config:/config

  # Não fica rodando: é disparado pelo agendador do servidor com
  #   docker compose run --rm collector
  collector:
    build:
      context: .
      target: collector
    profiles: ["collect"]
    volumes:
      - db:/data              # banco SQLite; nunca é servido ao público
      - export:/export

volumes:
  db:
  export:
  caddy_data:
  caddy_config:
